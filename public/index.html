<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Group Sandbox</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <div id="game"></div>
  <header class="topbar"><div><b>🌍 GROUP LOUNGE</b><small id="room-label">Your group's sandbox</small></div><div class="online"><i></i><span id="online-count">1</span> online</div></header>
  <div class="help">WASD / arrow keys to move · drag to look around · tap a table to play</div>
  <section class="panel" id="table-panel" hidden>
    <button class="close" id="close-panel">×</button><p class="eyebrow">GAME TABLE</p><h2 id="table-title">Choose a game</h2>
    <div id="game-list" class="game-list"></div><div id="game-detail"></div>
  </section>
  <section class="actions"><button data-emote="hug">🫂 Hug</button><button data-emote="slap">🖐 Slap</button><button data-emote="kiss">💋 Kiss</button><button data-emote="wave">👋 Wave</button></section>
  <div class="toast" id="toast"></div>
  <script type="module" src="/app.js"></script>
</body></html>
