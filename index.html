<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Group Sandbox · Social Lounge</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <main id="game" aria-label="3D social lounge"></main>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <div><b>THE HANGOUT</b><small id="room-label">Your group's lounge</small></div>
    </div>
    <div class="online"><i></i><span id="online-count">1</span><span class="online-word">online</span></div>
  </header>
  <div class="help" id="control-help">WASD / Arrow keys to move · Right-click + drag to look around</div>

  <div class="mobile-controls" id="mobile-controls">
    <div class="joystick-wrap">
      <div class="joystick" id="joystick" aria-label="Movement joystick">
        <span class="joystick-ring"></span>
        <span class="joystick-knob" id="joystick-knob"></span>
      </div>
      <span class="joystick-label">MOVE</span>
    </div>
  </div>

  <section class="panel" id="table-panel" hidden>
    <button class="close" id="close-panel" aria-label="Close">×</button>
    <p class="eyebrow">LOUNGE GAME TABLE</p>
    <h2 id="table-title">Choose a game</h2>
    <div id="game-list" class="game-list"></div>
    <div id="game-detail"></div>
  </section>

  <nav class="actions" aria-label="Avatar actions">
    <button data-emote="hug" aria-label="Hug">🫂 <span>Hug</span></button>
    <button data-emote="slap" aria-label="Slap">🖐️ <span>Slap</span></button>
    <button data-emote="kiss" aria-label="Kiss">💋 <span>Kiss</span></button>
    <button data-emote="wave" aria-label="Wave">👋 <span>Wave</span></button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
